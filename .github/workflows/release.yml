name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        required: true
      tokenizers_proto_version:
        required: true
permissions:
  id-token: write
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest
    env:
      NET_RUNTIMES: "linux-arm64 linux-x64 osx-arm64 osx-x64 win-arm64 win-x64"
      RUST_RUNTIMES: "aarch64-linux-gnu x86_64-linux-gnu aarch64-darwin x86_64-darwin aarch64-windows x86_64-windows"
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          ref: v${{ inputs.version }}
      - name: set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.203'
      - name: download libraries
        run: |
          read -a net_runtimes <<< "${{ env.NET_RUNTIMES }}"
          read -a rust_runtimes <<< "${{ env.RUST_RUNTIMES }}"
          for ((i=0;i<${#net_runtimes[@]};i++))
          do
            mkdir -p ./runtimes/${net_runtimes[i]}/native
            curl -L "https://github.com/IgnaciodelaTorreArias/tokenizers_proto/releases/download/v${{ inputs.tokenizers_proto_version }}/${rust_runtimes[i]}.tar.gz" |
            tar -xzf - -C ./runtimes/${net_runtimes[i]}/native
          done
      - name: run dotnet pack
        run: dotnet pack Tokenizers.HuggingFace.csproj -c Release -p:PackageVersion=${{ inputs.version }}
      - uses: NuGet/login@v1.2.0
        id: login
        with:
          user: lazy_engineer
      - name: publish to nuget
        run: dotnet nuget push ./bin/Release/*.nupkg --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://www.nuget.org/api/v2/package
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Release v${{ inputs.version }}
          tag_name: v${{ inputs.version }}
          draft: false
          files: |
            bin/Release/*.nupkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
